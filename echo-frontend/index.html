      THESIS: A record that never erases is a physical discipline, not a
      feature list. This page is a witnessed laboratory notebook, where a
      changed decision is ruled through once and left legible. It refuses the
      dark-gradient AI-SaaS hero with a floating chat mockup, and equally
      refuses that page's opposite — the hairline-editorial white sheet with a
      serif lede and mono eyebrows, which is what this page used to be.

      pre-printed grid, iron-gall blue-black ink, an oxblood cloth binding
      holding a full-height field at the left edge, and vermilion reserved for
      corrections, page numbers and witness stamps. Archivo throughout, using
      its live 62–125% width axis the way stationery does: compressed rubrics,
      normal entries, extended headings. No cards, no eyebrows, no glass.

      STORY: The visitor sees a decision struck through and still readable,
      understands that Recall keeps the history of its own changes of mind, and
      signs the notebook to start one.
