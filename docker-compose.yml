volumes:
  caddy_data:
  caddy_config:

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    image: theskysid/echo-messaging-app:${APP_TAG:-latest}
    container_name: echo-backend
    restart: unless-stopped
    <<: *logging
    env_file:
      - ./.env
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  caddy:
    image: caddy:2
    container_name: caddy-proxy
    restart: unless-stopped
    <<: *logging
    env_file:
      - ./.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - app
