volumes:
  postgres_data:
  caddy_data:
  caddy_config:

# json-file logs are unbounded by default — cap them so a chatty container
# can't fill the instance disk.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: echo-postgres
    restart: unless-stopped
    <<: *logging
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 5s
      retries: 5
      timeout: 5s

  app:
    image: theskysid/echo-messaging-app:${APP_TAG:-latest}
    container_name: echo-backend
    restart: unless-stopped
    <<: *logging
    env_file:
      - ./.env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    image: theskysid/echo-messaging-frontend:${APP_TAG:-latest}
    container_name: echo-frontend
    restart: unless-stopped
    <<: *logging
    depends_on:
      - app

  caddy:
    image: caddy:2-alpine
    container_name: echo-caddy
    restart: unless-stopped
    <<: *logging
    env_file:
      - ./.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend